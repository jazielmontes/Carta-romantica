<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <div class="container border p-3">
        <h1>Formularios HTML y Boostrap</h1>
        
        <div class="px-5"></div>
            <form action="" method="post">
                <div class="mb-3 mt-3">
                    <label for="usuarios" class="form-label">Usuarios:</label>
                    <input type="text" class="form-control" id="idusuarios" placeholder="ingrese su usuario" name="idusuario">
                </div>
                <div class="mb-3">
                    <label for="pwd" class="form-label">Contraseña:</label>
                    <input type="password" class="form-control" id="idpwd"  placeholder="Ingrese su contraseña" name="idpwd">
                    <button type="sibmit" class="btn btn-primary mt-3">Enviar</button>
                   

                </div>
            </form>
   
        <hr>
        <form>
            <div class="row">
                <div class="col-5">
                    <input type="text" class="form-control" id="idusuarios2"
                    placeholder="Ingrese su usuario" name="idusuario2">
                </div>
                <div class="col-5">
                    <input type="password" class="form-control" id="idpwd2"
                    placeholder="ingrese su contraseña" name="idpwd2">
                </div>
                <div class="col-2">
                    <button type="submit" class="btn btn-primary">Enviar</button>
                </div>
            </div>
        </form>

        <hr>

        <form>
            <input type="text" class="form-control form-control-lg" placeholder="input Grande">
            <input type="text" class="form-control mt-3" placeholder="input Normal">
            <input type="text" class="form-control form-control-sm mt-3" placeholder="input Pequeño">
            <input type="text" class="form-control mt-3" placeholder="input Desabilitado" disabled>
            <input type="text" class="form-control mt-3" placeholder="input Solo Lectura" readonly>
            <input type="text" class="form-control-plaintext mt-3" placeholder="input Texto Plano">
            <input type="color" class="form-control form-control-color mt-3" value="#CCCCCC">
        </form>

        <form>
            <label for="sel1" class="form-label">Select list (select one):</label>
            <select class="form-select" id="sel1" name="sellist1">
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
            </select>
            <br>

            <label for="sel2" class="form-label">Multiple select list:</label>
            <select multiple class="form-select" name="sellist2" id="sel2">
                <option>1</option>
                <option>2</option>
                <option>3</option>
                <option>4</option>
                <option>5</option>
            </select>
        </form>

        <form action="">
            <div class="form-check">
                <input type="radio" class="form-check-input" name="" id="radio1">
                <label class="form-check-label" for="radio1">Opcion 1</label>
            </div>
            <div class="form-check">
                <input type="radio" class="form-check-input" name="" id="radio2">
                <label class="form-check-label" for="radio2">Opcion 2</label>
            </div>
            <div class="form-check">
                <input type="radio" class="form-check-input" disabled>
                <label class="form-check-label" for="radio1">Opcion 3</label>
            </div>
            <button type="submit" class="btn btn-primary mt-3">Submit</button>
        </form>

        <form action="">
            <div class="form-check form-switch">
                <input class="form-check-input" type="checkbox" id="mySwitch" name="darckbox">

            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
